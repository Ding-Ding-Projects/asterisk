name: ding-pbx-control-plane

services:
  control-plane:
    image: ${DING_PBX_IMAGE:?Set DING_PBX_IMAGE to the immutable image reference}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
      - /run/asterisk:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0750
    ports:
      # The host-side address controls publication. The process always listens on
      # every container interface so an explicitly published host address cannot
      # accidentally create a split-brain bind inside the container.
      - "${DING_PBX_BIND_ADDRESS:-127.0.0.1}:${DING_PBX_PORT:-8088}:8088"
    volumes:
      - ding-pbx-data:/var/lib/ding-pbx-console
      - ding-pbx-asterisk-etc:/etc/asterisk
      - ding-pbx-asterisk-lib:/var/lib/asterisk
      - ding-pbx-asterisk-log:/var/log/asterisk
      - ding-pbx-asterisk-spool:/var/spool/asterisk
    environment:
      DING_HOST: 0.0.0.0
      DING_PORT: 8088
      DING_DATA_DIR: /var/lib/ding-pbx-console
      DING_ASTERISK_TRANSPORT: local
      DING_PBX_NETWORK_MODE: admin-only
      DING_PBX_MOUNT_PROFILE: five-volumes-plus-run-tmpfs
      # TLS paths point at Docker secrets, never at an image layer or a shell
      # variable containing secret bytes.
      DING_TLS_CERT: /run/secrets/tls_cert
      DING_TLS_KEY: /run/secrets/tls_key
    secrets:
      - tls_cert
      - tls_key
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:8088/api/v1/health',{rejectUnauthorized:false},r=>{process.exitCode=r.statusCode===200?0:1}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      org.opencontainers.image.title: Ding PBX hosted control plane
      org.opencontainers.image.revision: ${DING_PBX_SOURCE_COMMIT:?Set the exact source commit}
      org.opencontainers.image.version: ${DING_PBX_VERSION:?Set the image version}
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.service: control-plane
      io.ding.pbx.exposed-surface: admin-only
      io.ding.pbx.mount-profile: five-volumes-plus-run-tmpfs
    networks:
      - control-plane

volumes:
  ding-pbx-data:
    name: ding-pbx-control-plane-data
    labels:
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.volume: control-plane-data
  ding-pbx-asterisk-etc:
    name: ding-pbx-control-plane-asterisk-etc
    labels:
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.volume: asterisk-etc
  ding-pbx-asterisk-lib:
    name: ding-pbx-control-plane-asterisk-lib
    labels:
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.volume: asterisk-lib
  ding-pbx-asterisk-log:
    name: ding-pbx-control-plane-asterisk-log
    labels:
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.volume: asterisk-log
  ding-pbx-asterisk-spool:
    name: ding-pbx-control-plane-asterisk-spool
    labels:
      io.ding.pbx.project: ding-pbx
      io.ding.pbx.volume: asterisk-spool

networks:
  control-plane:
    internal: true

secrets:
  tls_cert:
    file: ${DING_PBX_TLS_CERT_FILE:?Set a host path to the TLS certificate}
  tls_key:
    file: ${DING_PBX_TLS_KEY_FILE:?Set a host path to the TLS private key}
