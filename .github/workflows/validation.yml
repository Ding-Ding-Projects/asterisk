name: Validate console pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-validation:
    name: Test and build Ding PBX Console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use repository-pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install locked console dependencies
        working-directory: console
        run: npm ci

      - name: Generate PBX M3 extension artifact
        working-directory: console
        run: npm run compile:design

      - name: Upload generated PBX M3 control
        uses: actions/upload-artifact@v4
        with:
          name: ding-pbx-generated-m3-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/app/renderer/src/generated/m3-control.tsx
          if-no-files-found: error
          retention-days: 2

      - name: Run repository test suite
        working-directory: console
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ding-pbx-npm-test.log"

      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ding-pbx-test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ding-pbx-npm-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build production console
        working-directory: console
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/ding-pbx-build.log"

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ding-pbx-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ding-pbx-build.log
          if-no-files-found: warn
          retention-days: 14
