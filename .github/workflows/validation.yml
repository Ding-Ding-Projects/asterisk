name: Validate console pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-validation:
    name: Test and build Ding PBX Console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use repository-pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install locked console dependencies
        working-directory: console
        run: npm ci

      - name: Run repository test suite
        working-directory: console
        run: npm test

      - name: Build production console
        working-directory: console
        run: npm run build
