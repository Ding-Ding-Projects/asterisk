name: Compose and publish Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-pages:
    name: Compose and publish the documentation site
    runs-on: windows-2025
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
      - name: Bootstrap site build dependencies
        shell: cmd
        run: download-dependencies.bat /s
      - name: Resolve the newest verified installer download
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Never blocks the Pages deploy: the site's own fallback below is honest
          # and correct when no verified release manifest can be resolved, so a
          # failure here is recorded as evidence rather than failing this step.
          $nodeRecord = (Get-Content -Raw dependency-manifest.json | ConvertFrom-Json).dependencies | Where-Object id -eq 'node-win-x64'
          $node = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "DingPBX\toolchains\$($nodeRecord.archiveRoot)\node.exe"
          & $node console/scripts/resolve-site-download-manifest.mjs --out console/site/release-manifest.local.json
      - name: Compose the static Pages tree without tests or lint
        shell: powershell
        run: |
          $nodeRecord = (Get-Content -Raw dependency-manifest.json | ConvertFrom-Json).dependencies | Where-Object id -eq 'node-win-x64'
          $node = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "DingPBX\toolchains\$($nodeRecord.archiveRoot)\node.exe"
          & $node console/site/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'console/site/dist/index.html')) { throw 'compose-site did not create console/site/dist/index.html' }
          if (-not (Test-Path -LiteralPath 'console/site/dist/build-manifest.json')) { throw 'compose-site did not create console/site/dist/build-manifest.json' }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: console/site/dist
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Record Pages evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $download = $null
          if (Test-Path -LiteralPath 'console/site/dist/build-manifest.json') {
            $download = (Get-Content -Raw console/site/dist/build-manifest.json | ConvertFrom-Json).download
          }
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            pageUrl = '${{ steps.deploy.outputs.page_url }}'
            runner = '${{ runner.name }}'
            download = $download
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 evidence/pages.json
      - name: Upload Pages evidence even after a deployment failure
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pages-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/pages.json
          if-no-files-found: warn
          retention-days: 14
