name: Build, package, and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  build-asterisk-runtime:
    name: Build complete Asterisk WSL runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the complete Ubuntu root filesystem, and best-effort publish it
        shell: pwsh
        env:
          # This is the one compile CI still always does: build-asterisk-wsl-bundle.ps1
          # compiles Asterisk from this exact commit as it always has. What is new is
          # DING_PBX_PUBLISH_ASTERISK_IMAGE=1, which makes the script also push the
          # image it just built, tagged and digest-pinned by this exact commit, so a
          # later run (build-asterisk-wsl-bundle-from-image.ps1 on a contributor's
          # machine, a re-run of this same workflow) can pull and export it instead of
          # recompiling. Publication is best-effort: Publish-AsteriskRuntimeImage never
          # throws, so a missing or refused registry credential cannot fail this job -
          # the rootfs this job exists to produce is unaffected either way, and the
          # provenance and evidence steps below record honestly whether it happened.
          DING_PBX_PUBLISH_ASTERISK_IMAGE: '1'
          DING_PBX_ASTERISK_IMAGE_REGISTRY: ghcr.io
          DING_PBX_ASTERISK_IMAGE_REPOSITORY: ${{ github.repository }}
          DING_PBX_REGISTRY_USER: ${{ github.actor }}
          DING_PBX_REGISTRY_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./console/scripts/build-asterisk-wsl-bundle.ps1

      - name: Record image publication evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $provenancePath = 'console/resources/asterisk-wsl-rootfs.json'
          $record = [ordered]@{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            provenanceFound = (Test-Path -LiteralPath $provenancePath)
          }
          if ($record.provenanceFound) {
            $provenance = Get-Content -Raw -LiteralPath $provenancePath | ConvertFrom-Json
            $record.sourceMethod = $provenance.sourceMethod
            $record.imageRef = $provenance.imageRef
            $record.imageDigest = $provenance.imageDigest
            $record.published = [bool]$provenance.imageDigest
          }
          $record | ConvertTo-Json | Set-Content -Encoding utf8 evidence/asterisk-image-publication.json
          if ($record.provenanceFound -and $record.published) {
            Write-Host "Published: $($record.imageRef) ($($record.imageDigest))."
          } else {
            Write-Warning 'The Asterisk runtime image was not published on this run; the rootfs was still produced by a local compile. See evidence/asterisk-image-publication.json.'
          }

      - name: Upload image publication evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/asterisk-image-publication.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the pinned WSL runtime for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-wsl-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            console/resources/asterisk-wsl-rootfs.tar
            console/resources/asterisk-wsl-rootfs.json
          if-no-files-found: error
          retention-days: 2

  resolve-runner:
    name: Resolve available Windows runner
    runs-on: windows-2025
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      workflow-started: ${{ steps.resolve.outputs.workflow-started }}
    steps:
      - name: Select an available compatible runner or pinned cloud fallback
        id: resolve
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $started = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          "workflow-started=$started" >> $env:GITHUB_OUTPUT
          $selected = $null
          try {
            $inventory = gh api "repos/${{ github.repository }}/actions/runners?per_page=100" | ConvertFrom-Json
            $selected = $inventory.runners |
              Where-Object {
                $_.status -eq 'online' -and -not $_.busy -and
                ($_.labels.name -contains 'self-hosted') -and
                ($_.labels.name -contains 'Windows') -and
                ($_.labels.name -contains 'X64')
              } |
              Select-Object -First 1
          } catch {
            Write-Warning "Repository runner inventory was unavailable: $($_.Exception.Message)"
          }
          if ($null -ne $selected) {
            $labels = @('self-hosted','Windows','X64')
            foreach ($label in $selected.labels.name) {
              if ($label -notin $labels -and $label -notin @('Default')) { $labels += $label }
            }
            $runner = ConvertTo-Json -Compress -InputObject $labels
            Write-Host "Selected available self-hosted runner '$($selected.name)' with labels $runner."
          } else {
            $runner = '["windows-2025"]'
            Write-Host 'No compatible available repository runner was found; using pinned windows-2025.'
          }
          "runner=$runner" >> $env:GITHUB_OUTPUT

      - name: Record runner resolution evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            runner = '${{ steps.resolve.outputs.runner }}'
            workflowStarted = '${{ steps.resolve.outputs.workflow-started }}'
          } | ConvertTo-Json | Set-Content -Encoding utf8 evidence/runner-resolution.json

      - name: Upload runner resolution evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runner-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runner-resolution.json
          if-no-files-found: warn
          retention-days: 14

  build-package:
    name: Build unsigned Squirrel.Windows package
    needs: [resolve-runner, build-asterisk-runtime]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runner) }}
    env:
      DING_PBX_VERSION: 0.1.${{ github.run_number }}
      DING_PBX_CANDIDATE_COMMIT: ${{ github.sha }}
      DING_PBX_RELEASE_TAG: ding-pbx-console-v0.0.${{ github.run_number }}-r${{ github.run_attempt }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact bundled Asterisk WSL runtime
        uses: actions/download-artifact@v4
        with:
          name: asterisk-wsl-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/resources

      - name: Build console without tests or lint
        shell: cmd
        run: build.bat /s

      - name: Build and verify unsigned Squirrel.Windows artifacts
        shell: cmd
        run: build-installer.bat /s

      - name: Produce reproducible line-count evidence
        shell: powershell
        run: |
          $nodeRecord = (Get-Content -Raw dependency-manifest.json | ConvertFrom-Json).dependencies | Where-Object id -eq 'node-win-x64'
          $node = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "DingPBX\toolchains\$($nodeRecord.archiveRoot)\node.exe"
          & $node console/scripts/count-lines.mjs --markdown console/release/line-count.md --json console/release/line-count.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage safe release artifacts and hashes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-staging,evidence | Out-Null
          Copy-Item console/dist/squirrel-windows/squirrel-windows/* -Destination release-staging -Force
          Copy-Item console/resources/update-manifest.json -Destination release-staging/update-manifest.json -Force
          Get-ChildItem release-staging -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii release-staging/SHA256SUMS.txt
          Copy-Item console/release/line-count.md,console/release/line-count.json -Destination release-staging
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            runnerName = '${{ runner.name }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            workflowStarted = '${{ needs.resolve-runner.outputs.workflow-started }}'
            signing = 'prohibited-and-not-used'
          } | ConvertTo-Json | Set-Content -Encoding utf8 evidence/build-context.json

      - name: Upload safe build and package outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ding-pbx-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-staging/**
            evidence/build-context.json
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish unique console release
    needs: [resolve-runner, build-package]
    runs-on: windows-2025
    env:
      DING_PBX_VERSION: 0.1.${{ github.run_number }}
      DING_PBX_CANDIDATE_COMMIT: ${{ github.sha }}
      DING_PBX_RELEASE_TAG: ding-pbx-console-v0.0.${{ github.run_number }}-r${{ github.run_attempt }}
    steps:
      - name: Check out release records
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact build outputs
        uses: actions/download-artifact@v4
        with:
          name: ding-pbx-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded

      - name: Publish and verify one non-draft release
        id: publish
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:DING_PBX_RELEASE_TAG
          $staging = Resolve-Path 'downloaded/release-staging'
          $setup = @(Get-ChildItem $staging -File -Filter '*Setup.exe')
          $releases = @(Get-ChildItem $staging -File -Filter 'RELEASES')
          $full = @(Get-ChildItem $staging -File -Filter '*-full.nupkg')
          $identity = @(Get-ChildItem $staging -File -Filter 'release-identity.json')
          $sums = @(Get-ChildItem $staging -File -Filter 'SHA256SUMS.txt')
          if ($setup.Count -ne 1 -or $releases.Count -ne 1 -or $full.Count -lt 1 -or $identity.Count -ne 1 -or $sums.Count -ne 1) { throw 'Required Squirrel.Windows release identity assets are incomplete.' }
          $identityRecord = Get-Content -Raw $identity[0].FullName | ConvertFrom-Json
          if ($identityRecord.schemaVersion -ne 1 -or $identityRecord.product -ne 'ding-pbx-console' -or $identityRecord.version -ne $env:DING_PBX_VERSION -or $identityRecord.candidateCommit -ne $env:DING_PBX_CANDIDATE_COMMIT -or $identityRecord.tag -ne $tag) { throw 'Packaged release identity does not match the exact candidate, version, and tag.' }
          if ($identityRecord.published -ne $true) { throw 'Published release identity must be marked published.' }
          $releaseText = Get-Content -Raw $releases[0].FullName
          foreach ($package in $full) { if ($releaseText -notmatch [regex]::Escape($package.Name)) { throw "RELEASES does not reference $($package.Name)." } }
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $existingRelease = gh release view $tag --json tagName 2>$null
            $releaseProbeExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($releaseProbeExit -eq 0) { throw "Release tag $tag already exists; tags are immutable and never recycled." }
          if ($releaseProbeExit -ne 1) { throw "Release uniqueness probe exited $releaseProbeExit." }

          # Dim sum code name and photo, resolved from the public catalogue at release time.
          # Best effort by contract: a release is never blocked, delayed or renamed because
          # the catalogue is unreachable, so every path below ends with a message rather than
          # a throw. Nothing is vendored -- the photo is fetched now and attached to this
          # release, because copying catalogue images into this repository is forbidden and a
          # second copy is a second authority that will eventually disagree with the first.
          $dimSum = $null
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            # The release notes are the ledger. Reading names back from published releases
            # keeps the record auditable without committing a file, which matters because a
            # release workflow that commits is a release workflow that triggers itself.
            $usedPath = Join-Path $PWD 'used-code-names.txt'
            $bodies = @()
            foreach ($previousTag in (gh release list --limit 200 --json tagName --jq '.[].tagName' 2>$null)) {
              $bodies += (gh release view $previousTag --json body --jq .body 2>$null)
            }
            $bodies -join "`n" | Set-Content -Encoding utf8 $usedPath
            $dimSumPath = Join-Path $PWD 'dim-sum.json'
            node '${{ github.workspace }}/console/scripts/dim-sum-code-name.mjs' --used-from $usedPath --out $dimSumPath 2>$null
            if (Test-Path $dimSumPath) {
              # Read as UTF-8 explicitly. This step runs under Windows PowerShell, whose
              # Get-Content defaults to the ANSI code page, so the dish name came back
              # double-encoded and the published notes carried mojibake where the
              # Traditional Chinese should have been. Naming the encoding removes the
              # dependency on which edition happens to run the step.
              $record = [System.IO.File]::ReadAllText($dimSumPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
              if ($record.resolved) {
                $photo = Join-Path $staging $record.asset
                Invoke-WebRequest -Uri $record.url -OutFile $photo -MaximumRedirection 5
                # Judge it by the file, not by the call: assert it decodes as a PNG rather
                # than trusting a 200 that may have carried an error page.
                if ((Test-Path $photo) -and ((Get-Item $photo).Length -gt 1024)) {
                  $signature = [System.IO.File]::ReadAllBytes($photo)[0..3]
                  if ($signature[0] -eq 0x89 -and $signature[1] -eq 0x50 -and $signature[2] -eq 0x4E -and $signature[3] -eq 0x47) {
                    $dimSum = $record
                  } else {
                    Remove-Item $photo -Force
                    Write-Host 'Dim sum photo did not decode as a PNG; shipping without it.'
                  }
                } else {
                  Write-Host 'Dim sum photo did not download; shipping without it.'
                }
              } else {
                Write-Host "No dim sum code name resolved: $($record.reason)"
              }
            }
          } catch {
            Write-Host "Dim sum resolution failed, shipping without it: $($_.Exception.Message)"
          } finally {
            $ErrorActionPreference = $previousPreference
          }

          $started = [DateTimeOffset]::Parse('${{ needs.resolve-runner.outputs.workflow-started }}')
          $notes = @()
          $notes += '# Ding PBX Console'
          $notes += ''
          $notes += '> [!WARNING]'
          $notes += '> These Squirrel.Windows artifacts are intentionally unsigned. Windows may show an unknown-publisher or SmartScreen warning.'
          $notes += ''
          $notes += "- Target commit: ``${{ github.sha }}``"
          $notes += '- Automated checks: none. GitHub Actions builds, packages, publishes, and attaches evidence only.'
          if ($dimSum) { $notes += "- Code name: **$($dimSum.codeName)** (``$($dimSum.id)``)" }
          $notes += "- Workflow started: ``$($started.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))``"
          $notes += '- Workflow completed: pending final publication timestamp'
          $notes += '- Workflow duration: pending final publication timestamp'
          $notes += ''
          $notes += '## SHA-256'
          $notes += '```text'
          $notes += Get-Content (Join-Path $staging 'SHA256SUMS.txt')
          $notes += '```'
          $notes += ''
          if ($dimSum) {
            $photoUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($dimSum.asset)"
            $notes += '## Code name'
            $notes += "![$($dimSum.alt)]($photoUrl)"
            $notes += ''
            $notes += "**$($dimSum.codeName)** -- from the public dim sum catalogue, volume ``$($dimSum.volume)``, attached here as ``$($dimSum.asset)``. The software is serious; the release still gets one steamer basket."
            $notes += ''
          }
          $notes += '## Project line count'
          $notes += Get-Content -Raw (Join-Path $staging 'line-count.md')
          $notesPath = Join-Path $PWD 'release-notes.md'
          $notes -join "`n" | Set-Content -Encoding utf8 $notesPath

          $assets = Get-ChildItem $staging -File | ForEach-Object FullName
          gh release create $tag @assets --target '${{ github.sha }}' --title "Ding PBX Console $tag" --notes-file $notesPath --verify-tag=false
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited $LASTEXITCODE" }

          $completed = [DateTimeOffset]::UtcNow
          $duration = $completed - $started
          $durationText = '{0:00}:{1:00}:{2:00}' -f [Math]::Floor($duration.TotalHours),$duration.Minutes,$duration.Seconds
          $body = Get-Content -Raw $notesPath
          $body = $body.Replace('- Workflow completed: pending final publication timestamp', "- Workflow completed: ``$($completed.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))``")
          $body = $body.Replace('- Workflow duration: pending final publication timestamp', "- Workflow duration: ``$durationText``")
          $body | Set-Content -Encoding utf8 $notesPath
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "gh release edit exited $LASTEXITCODE" }

          $release = gh release view $tag --json tagName,isDraft,targetCommitish,assets,url | ConvertFrom-Json
          if ($release.isDraft) { throw 'Published release is unexpectedly a draft.' }
          if ($release.targetCommitish -ne '${{ github.sha }}') { throw "Release target $($release.targetCommitish) is not ${{ github.sha }}." }
          foreach ($asset in $assets) {
            $name = Split-Path -Leaf $asset
            if ($name -notin $release.assets.name) { throw "Published release is missing $name." }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "url=$($release.url)" >> $env:GITHUB_OUTPUT

      - name: Record release verification evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            status = '${{ job.status }}'
            tag = '${{ steps.publish.outputs.tag }}'
            url = '${{ steps.publish.outputs.url }}'
            runner = '${{ runner.name }}'
          } | ConvertTo-Json | Set-Content -Encoding utf8 evidence/release.json
          if (Test-Path release-notes.md) { Copy-Item release-notes.md evidence/release-notes.md }

      - name: Upload release evidence even after a publication failure
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 30
