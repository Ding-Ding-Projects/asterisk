<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Material Asterisk</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101510; color: #e6efe6; display: flex;
    align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #182018; padding: 2rem; border-radius: 8px; width: 320px; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 4px; border: 1px solid #345; background: #0d120d; color: inherit; }
  button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; border-radius: 4px; border: none; background: #3a8a4c; color: white; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #message { min-height: 1.4em; margin-top: 0.75rem; font-size: 0.85rem; color: #ff9d9d; }
  #warning { font-size: 0.75rem; color: #d9b23a; margin-top: 1rem; }
</style>
</head>
<body>
<form id="login">
  <h1>Material Asterisk</h1>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required />
  <button type="submit">Sign in</button>
  <div id="message" role="alert"></div>
  <div id="warning"></div>
</form>
<script>
(async function () {
  const sessionRes = await fetch('/api/session', { credentials: 'same-origin' }).catch(() => undefined);
  const session = sessionRes && sessionRes.ok ? await sessionRes.json() : undefined;
  if (session && session.needsSetup) { window.location.assign('/setup.html'); return; }
  if (session && session.authenticated) { window.location.assign('/'); return; }
  if (session && session.plainHttpWarning) document.getElementById('warning').textContent = session.plainHttpWarning;

  const form = document.getElementById('login');
  const message = document.getElementById('message');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    message.textContent = '';
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const button = form.querySelector('button');
    button.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok) { window.location.assign('/'); return; }
      message.textContent = data.message || 'Sign-in failed.';
    } catch {
      message.textContent = 'Could not reach the server.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
