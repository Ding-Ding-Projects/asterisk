appId: org.dingdingprojects.dingpbxconsole
productName: Material Asterisk
directories:
  output: dist/squirrel-windows
files:
  - dist/**/*
  - dist-electron/**/*
  - app/electron/preload.cjs
  - app/electron/preload-probe.cjs
  - app/electron/probe-path.cjs
asarUnpack:
  - node_modules/keytar/**
extraResources:
  - from: resources/asterisk-wsl-rootfs.tar
    to: asterisk/asterisk-wsl-rootfs.tar
  - from: resources/asterisk-wsl-rootfs.json
    to: asterisk/asterisk-wsl-rootfs.json
  - from: resources/update-manifest.json
    to: update-manifest.json
  - from: resources/school-mode-provenance.json
    to: school-mode-provenance.json
  - from: native-messaging
    to: native-messaging
  - from: resources/forge/gh.exe
    to: forge/gh.exe
  - from: scripts/forge-device-signin.ps1
    to: forge/forge-device-signin.ps1
win:
  target: squirrel
  icon: assets/icon.png
  signExecutable: false
  signAndEditExecutable: false
forceCodeSigning: false
squirrelWindows:
  artifactName: Material-Asterisk-Setup.${ext}
  iconUrl: https://raw.githubusercontent.com/Ding-Ding-Projects/asterisk/ffa7f362830eed405e52e891ef8516df8715da6c/console/assets/icon.png
